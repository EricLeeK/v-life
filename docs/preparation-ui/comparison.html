<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>备考 · 改版对比</title><style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#f5f4f1;color:#26221b;font:15px/1.6 system-ui}header{max-width:1500px;margin:0 auto 24px}h1{font:600 30px Georgia,serif;margin:0 0 10px}p{color:#756d61;margin:0 0 20px}nav{display:flex;gap:8px;flex-wrap:wrap}button,a{font:inherit}button{border:1px solid #dcd8cf;border-radius:8px;padding:8px 16px;background:white;cursor:pointer}button[aria-pressed=true]{background:#426a29;color:white;border-color:#426a29}a{color:#426a29}.frames{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:1500px;margin:auto}figure{margin:0;min-width:0}figcaption{font-weight:600;margin-bottom:10px}img{width:100%;display:block;border:1px solid #ddd8ce;border-radius:12px}.mobile img{max-width:390px;margin:auto}.mobile figcaption{text-align:center}@media(max-width:700px){body{padding:20px}.frames{grid-template-columns:1fr}h1{font-size:26px}}</style><header><h1>备考 · 专注复盘</h1><p>相同内容，改版前后对照。<a href="/preparation">打开新版备考</a> · <a href="/preparation/review">试用复习页</a></p><nav aria-label="对比视图"><button data-page="home" aria-pressed="true">备考总览</button><button data-page="review" aria-pressed="false">今日复习</button><button id="size" aria-pressed="false">手机视图</button></nav></header><main class="frames"><figure><figcaption>改版前</figcaption><a id="old-link"><img id="old" alt="改版前界面"></a></figure><figure><figcaption>改版后</figcaption><a id="new-link"><img id="new" alt="改版后界面"></a></figure></main><script>let page='home',mobile=false;function paint(){for(const [id,folder]of [['old','before'],['new','after']]){const src=`${folder}/${page}/page-${mobile?'390x844':'1440x1000'}.png`;document.getElementById(id).src=src;document.getElementById(id+'-link').href=src}document.querySelector('main').classList.toggle('mobile',mobile)}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('[data-page]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));paint()});document.getElementById('size').onclick=e=>{mobile=!mobile;e.target.setAttribute('aria-pressed',String(mobile));paint()};paint();</script></html>
