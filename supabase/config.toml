# OAuth discovery and opaque API Keys must reach the shared authentication adapter.
# It verifies either credential and constructs an RLS-scoped client itself.
[functions.mcp-server]
verify_jwt = false

# Same API Key / OAuth authentication as MCP.
[functions.agent-api]
verify_jwt = false

# The website endpoint verifies its bearer token with Supabase Auth.
[functions.newspaper]
verify_jwt = false

# Scheduled endpoints verify a dedicated worker secret before using service credentials.
[functions.newspaper-archive]
verify_jwt = false

[functions.newspaper-images-worker]
verify_jwt = false
